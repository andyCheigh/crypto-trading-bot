[project]
name = "trading-bot"
version = "1.0.0"
description = "Telegram stock trading signal bot with quant algorithms"
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.31",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "python-telegram-bot>=20.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
trading-bot = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
